[package]
name = "turntable"
version = "0.1.0"
edition = "2021"
description = "Player musicale headless con interfaccia MPRIS su D-Bus"
authors = ["dilidin2 <dilidin2@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/dilidin2/turntable"
keywords = ["mpris", "music", "player", "quickshell", "dbus"]
categories = ["multimedia", "multimedia::audio"]

[[bin]]
name = "turntable"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
zbus = "4"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "isomp4"] }
cpal = "0.15"
lofty = "0.22"
rand = "0.8"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
